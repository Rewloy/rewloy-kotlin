org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
kotlin.code.style=official
# The library depends on the standard library at the oldest version its API level allows (see rewloy/build.gradle.kts).
kotlin.stdlib.default.dependency=false
# Where Gradle looks for the JDK 8 the compatibility tests run on (setup-java sets this variable in CI).
org.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_8_ARM64
org.gradle.java.installations.auto-download=false
# A stalled download fails and is retried instead of hanging the build.
systemProp.org.gradle.internal.http.connectionTimeout=30000
systemProp.org.gradle.internal.http.socketTimeout=30000
